[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-commander"
version = "0.4.3"
description = "Convert Hugging Face datasets into Apple MLX formats, configure parameters, and run training and fine-tuning via interactive TUI and CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Tom Kubik" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
parquet = [
    "pyarrow>=12.0.0",
]
arrow = [
    "pyarrow>=12.0.0",
]
duckdb = [
    "duckdb>=0.9.0",
]
lance = [
    "pylance>=0.10.0",
]
mcp = [
    "mcp>=1.0.0; python_version >= '3.10'",
]
wandb = [
    "wandb>=0.16.0",
]
all = [
    "datasets>=2.14.0",
    "pyarrow>=12.0.0",
    "duckdb>=0.9.0",
    "pylance>=0.10.0",
    "mcp>=1.0.0; python_version >= '3.10'",
    "wandb>=0.16.0",
]

[project.scripts]
mlx_commander = "mlx_commander.cli:main"

[project.urls]
Homepage = "https://github.com/tomkubik/mlx_commander"
Repository = "https://github.com/tomkubik/mlx_commander.git"

[tool.hatch.build.targets.wheel]
packages = ["mlx_commander"]

[tool.hatch.build.targets.sdist]
include = [
    "/mlx_commander",
    "/mlx_commander.py",
    "/run.py",
    "/README.md",
    "/LICENSE",
    "/requirements.txt",
    "/smithery.yaml",
    "/docs",
]
