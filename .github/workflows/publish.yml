name: Publish to PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mlx_commander
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: write  # Mandatory for creating GitHub Releases and tags

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit test suite
        run: |
          python -m unittest discover -v tests

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: |
          uv build

      - name: Publish to PyPI
        id: pypi-publish
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          skip-existing: true

      - name: Wait before retry (if GitHub OIDC/network encountered transient 503)
        if: steps.pypi-publish.outcome == 'failure'
        run: sleep 10

      - name: Retry Publish to PyPI
        if: steps.pypi-publish.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Extract package version
        id: pkg_info
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*[\"\\\']([^\"\\\']+)[\"\\\']', open('mlx_commander/__init__.py').read()).group(1))")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_info.outputs.tag }}
          name: "${{ steps.pkg_info.outputs.tag }}"
          generate_release_notes: true
          make_latest: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


