name: Publish to PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mlx_commander
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit test suite
        run: |
          python -m unittest discover -v tests

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: |
          uv build

      - name: Publish to PyPI
        id: pypi-publish
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          skip-existing: true

      - name: Wait before retry (if GitHub OIDC/network encountered transient 503)
        if: steps.pypi-publish.outcome == 'failure'
        run: sleep 10

      - name: Retry Publish to PyPI
        if: steps.pypi-publish.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

