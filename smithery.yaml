# Smithery configuration for MLX Commander MCP Server
# https://smithery.ai/docs/config
name: mlx_commander
description: Orthodox commander style TUI and CLI toolkit to convert Hugging Face datasets into Apple MLX format with live preview and agent pre-population.
version: "0.2.0"
runtime: python
startCommand:
  type: stdio
  config:
    command: python3
    args:
      - -m
      - mlx_commander
      - --mcp
